<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <h1>Bench</h1>
      <p>chemistry calculator</p>
    </div>
    <div class="controls">
      <label class="toggle">
        <input type="checkbox" id="sigfigs" checked>
        <span>significant figures</span>
      </label>
      <button type="button" id="clear" class="ghost">Clear sheet</button>
    </div>
  </header>

  <main>
    <section class="sheet-column">
      <ol class="sheet" id="sheet"></ol>
      <p class="hint" id="hint">
        Type an expression and press Return. Anything you name with
        <code>=</code> stays available on every line below.
      </p>
    </section>

    <aside class="side">
      <section class="card">
        <h2>Set on this sheet</h2>
        <div id="vars" class="vars"></div>
      </section>

      <section class="card">
        <h2>Elements</h2>
        <div id="ptable" class="ptable"></div>
        <p class="ptable-readout" id="ptableReadout">Click a symbol to use it.</p>
      </section>

      <section class="card">
        <h2>How to write things</h2>
        <div class="reference" id="reference"></div>
      </section>
    </aside>
  </main>

  <div class="toast" id="toast" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastAction">Undo</button>
  </div>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
